## --- App config ---
spring.application.name=League of stats


# --- Telegram config ---
configuration.telegram-bot.username=league_of_stats_bot
configuration.telegram-bot.token=SECRET-KEY


## --- Riot config ---
configuration.riot-api.riot-api-token=SECRET-KEY


## --- API urls ---
service.riot.base-url=https://{region}.api.riotgames.com
service.riot.accoutns.get-account.url=/riot/account/v1/accounts/by-riot-id/{gameName}/{tagLine}
service.riot.league.get-entries.url=/lol/league/v4/entries/by-puuid/{encryptedPUUID}
service.riot.summoner.get-summoner-date.url=/lol/summoner/v4/summoners/by-puuid/{encryptedPUUID}
service.riot.match.get-match-ids-by-puuid.url=/lol/match/v5/matches/by-puuid/{puuid}/ids
service.riot.match.get-match-by-id.url=/lol/match/v5/matches/{matchId}